<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <title>For My Didi ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            background: #0d0b09;
            color: #f7eee3;
            font-family: "Poppins", sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        /* HERO */
        .hero {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background:
                radial-gradient(circle at 50% 20%, #3b2718 0%, #0d0b09 70%);
            padding: clamp(30px, 6vh, 60px) clamp(16px, 4vw, 30px);
            position: relative;
        }

        .eyebrow {
            color: #d6a85c;
            letter-spacing: clamp(3px, 1vw, 5px);
            text-transform: uppercase;
            font-size: clamp(11px, 2.5vw, 13px);
            margin-bottom: clamp(12px, 3vh, 20px);
            font-weight: 500;
        }

        h1 {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(38px, 8.5vw, 100px);
            line-height: 1.05;
            font-weight: 600;
            color: #d9aa5d;
            text-shadow: 0 4px 20px rgba(217, 170, 93, 0.25);
            max-width: 900px;
        }

        .hero h2 {
            font-family: "Cormorant Garamond", serif;
            font-size: clamp(24px, 5vw, 54px);
            font-weight: 400;
            margin-top: clamp(8px, 2vh, 15px);
            color: #f7eee3;
        }

        .hero p {
            max-width: 580px;
            width: 100%;
            margin-top: clamp(16px, 3vh, 25px);
            color: #c8bdb2;
            font-size: clamp(14px, 3vw, 16.5px);
            line-height: 1.7;
            padding: 0 10px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: clamp(28px, 5vh, 44px);
            padding: clamp(12px, 2.5vh, 16px) clamp(28px, 6vw, 42px);
            border: 1px solid #d6a85c;
            color: #d6a85c;
            text-decoration: none;
            border-radius: 35px;
            transition: all .35s ease;
            cursor: pointer;
            background: rgba(214, 168, 92, 0.05);
            font-size: clamp(14px, 3.5vw, 16px);
            font-weight: 500;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(214, 168, 92, 0.18);
            touch-action: manipulation;
        }

        .button:hover,
        .button:focus-visible {
            background: #d6a85c;
            color: #0d0b09;
            box-shadow: 0 0 30px rgba(214, 168, 92, 0.55);
            transform: translateY(-3px);
        }

        .button:active {
            transform: scale(0.97);
        }

        @media (max-width: 480px) {
            .hero {
                padding: 30px 16px;
            }
            .button {
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>

<body>

    <!-- HERO LANDING -->
    <section class="hero">

        <div class="eyebrow">
            A little something for you
        </div>

        <h1>Happy Raksha Bandhan</h1>

        <h2>Didi ❤️</h2>

        <p>
            Some bonds don't need a reason.
            They simply become one of the most beautiful parts of life.
        </p>

        <a href="main.html" class="button">
            Open Your Gift ✨
        </a>

    </section>

</body>

</html>
